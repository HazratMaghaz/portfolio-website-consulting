services:
  - type: web
    runtime: static
    name: hazratmaghaz-consulting
    repo: https://github.com/HazratMaghaz/portfolio-website-consulting
    branch: master
    buildCommand: "echo 'No build required for static HTML site'"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
